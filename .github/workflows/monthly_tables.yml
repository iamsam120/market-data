# 매일 확인하고, 이번 달 기준표가 아직 없으면 만든다 (그달 첫 실행 = 첫 거래일 무렵).
# 출처는 순위대로 고르고, 모두 실패하면 지난달 표를 그대로 둔다.
name: monthly-tables

on:
  schedule:
    - cron: "30 23 * * *"  # 한국 시각 08:30
  workflow_dispatch:
    inputs:
      force:
        description: "이번 달 표가 있어도 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시험
        run: pip install -q pytest && python -m pytest -q
      - name: 기준표
        id: build
        continue-on-error: true
        run: python -m marketdata.cli monthly ${{ inputs.force && '--force' || '' }}
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "data: 월간 기준표·출처 점검 ($(date -u +%F))"
          git pull -q --rebase && git push -q
      - name: 알림
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::출처 알림이 있습니다. '기준표' 단계 기록과 data/status/을 보세요."
          exit 1
