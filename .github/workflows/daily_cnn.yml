# 매일: CNN 공포탐욕 예비 수집 + 1순위(whit3rabbit)·예비 출처 점검
# 알림(2순위로 넘어감, 모든 출처 실패, 값이 다름)이 있으면 실행을 실패로 끝내 저장소 주인에게 메일이 간다.
name: daily-cnn

on:
  schedule:
    - cron: "0 22 * * *"  # 한국 시각 07:00
    - cron: "0 1 * * *"   # 한국 시각 10:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시험
        run: pip install -q pytest && python -m pytest -q
      - name: 수집과 점검
        id: collect
        continue-on-error: true
        run: python -m marketdata.cli cnn
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "data: CNN 예비 수집·출처 점검 ($(date -u +%F))"
          git pull -q --rebase && git push -q
      - name: 알림
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::출처 알림이 있습니다. '수집과 점검' 단계 기록과 data/sources.json을 보세요."
          exit 1
